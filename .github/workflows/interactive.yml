name: interactive
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        type: choice
        options:
          - ios
          - android
      minutes:
        description: Minutes to keep the device alive, max 90
        default: '45'
        type: string
permissions:
  contents: write
concurrency:
  group: interactive-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bash scripts/ios-interactive.sh "$MINUTES"
        env:
          MINUTES: ${{ inputs.minutes }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MINUTES: ${{ inputs.minutes }}
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash scripts/android-interactive.sh
